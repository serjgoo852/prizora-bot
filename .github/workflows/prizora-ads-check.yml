name: PRIZORA Ads safety checks

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "ads.py"
      - ".github/workflows/prizora-ads-check.yml"
  workflow_dispatch:

jobs:
  compile-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile main.py ads.py
      - name: Test isolated Ads database workflow
        env:
          DATABASE_PATH: ${{ runner.temp }}/prizora-ads-test.sqlite3
          PRIZORA_ADMIN_TELEGRAM_ID: "853680962"
        run: |
          python - <<'PY'
          import os
          import ads

          ads.init_ads_database()
          advertiser = 123456789
          campaign = ads.create_campaign_draft(
              advertiser, "Test channel", "https://t.me/test_channel",
              "Automated test campaign", 7, None
          )
          order = ads.create_ad_order(campaign, advertiser)

          # Ownership checks: a different user cannot submit payment.
          try:
              ads.record_payment_submission(order, advertiser + 1, advertiser_note="forbidden")
          except ValueError:
              pass
          else:
              raise AssertionError("Foreign advertiser submitted payment")

          # Payment confirmation alone must not activate unmoderated content.
          ads.record_payment_submission(order, advertiser, advertiser_note="test payment")
          ads.set_payment_review(order, 853680962, True, "CI test")
          assert ads.activate_paid_approved_campaigns() == 0

          # Content approval alone must not activate unpaid content.
          campaign2 = ads.create_campaign_draft(
              advertiser, "Second channel", "https://t.me/second_test",
              "Unpaid test campaign", 7, None
          )
          order2 = ads.create_ad_order(campaign2, advertiser)
          ads.set_campaign_moderation(campaign2, 853680962, "approve", "CI test")
          assert ads.activate_paid_approved_campaigns() == 0

          # Both independent approvals permit activation.
          ads.record_payment_submission(order2, advertiser, advertiser_note="second test payment")
          ads.set_payment_review(order2, 853680962, True, "CI test")
          assert ads.activate_paid_approved_campaigns() == 1
          row = ads.get_order(order2, advertiser)
          assert row["campaign_status"] == "active", row

          # Active campaigns must expire when their paid term has elapsed.
          import sqlite3
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              db.execute(
                  "UPDATE ad_campaigns SET ends_at='2000-01-01T00:00:00+00:00' WHERE campaign_id=?",
                  (campaign2,),
              )
          assert ads.expire_campaigns() == 1
          assert ads.get_order(order2, advertiser)["campaign_status"] == "completed"

          # Restore a valid active window for the independent placement tests.
          from datetime import datetime, timedelta, timezone
          future = (datetime.now(timezone.utc) + timedelta(days=7)).isoformat(timespec="seconds")
          current = datetime.now(timezone.utc).isoformat(timespec="seconds")
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              db.execute(
                  "UPDATE ad_campaigns SET status='active', starts_at=?, ends_at=? WHERE campaign_id=?",
                  (current, future, campaign2),
              )

          summary = ads.get_admin_summary()
          assert summary["campaigns"] == 2, summary

          # Placement safety: advertisers never see their own campaigns.
          assert ads.get_next_ad(advertiser, "home") is None

          # A different user receives the approved, paid and active campaign.
          shown = ads.get_next_ad(987654321, "home")
          assert shown and shown["campaign_id"] == campaign2, shown

          # A click requires a prior impression and is counted only once.
          assert ads.record_ad_click(campaign2, 987654321, "home") is True
          assert ads.record_ad_click(campaign2, 987654321, "home") is False
          assert ads.record_ad_click(campaign2, 111111111, "home") is False

          # Global frequency cap prevents a second ad immediately afterward.
          assert ads.get_next_ad(987654321, "home") is None

          # Pausing immediately blocks new clicks and delivery; resuming restores
          # the already-paid campaign without extending its original end date.
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              original_end = db.execute(
                  "SELECT ends_at FROM ad_campaigns WHERE campaign_id=?", (campaign2,)
              ).fetchone()[0]
          ads.set_campaign_moderation(campaign2, 853680962, "pause", "CI pause")
          assert ads.record_ad_click(campaign2, 987654321, "home") is False
          assert ads.get_next_ad(222222222, "home") is None
          ads.set_campaign_moderation(campaign2, 853680962, "resume", "CI resume")
          assert ads.activate_paid_approved_campaigns() == 1
          resumed = ads.get_order(order2, advertiser)
          assert resumed["campaign_status"] == "active", resumed
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              resumed_end = db.execute(
                  "SELECT ends_at FROM ad_campaigns WHERE campaign_id=?", (campaign2,)
              ).fetchone()[0]
          assert resumed_end == original_end, (original_end, resumed_end)

          # A stopped campaign cannot be reactivated by the approval scheduler.
          ads.set_campaign_moderation(campaign2, 853680962, "stop", "CI stop")
          assert ads.activate_paid_approved_campaigns() == 0
          assert ads.get_order(order2, advertiser)["campaign_status"] == "cancelled"
          assert ads.get_next_ad(333333333, "home") is None

          # Invalid lifecycle transitions must fail closed.
          for invalid_call in (
              lambda: ads.set_campaign_moderation(campaign2, 853680962, "resume", "invalid"),
              lambda: ads.set_campaign_moderation(campaign2, 853680962, "pause", "invalid"),
          ):
              try:
                  invalid_call()
              except ValueError:
                  pass
              else:
                  raise AssertionError("Invalid campaign transition was accepted")

          # A paused campaign whose paid term has expired cannot be resumed.
          campaign4 = ads.create_campaign_draft(
              advertiser, "Expired paused channel", "https://t.me/expired_paused",
              "Expired resume test", 7, None
          )
          order4 = ads.create_ad_order(campaign4, advertiser)
          ads.record_payment_submission(order4, advertiser, advertiser_note="test")
          ads.set_payment_review(order4, 853680962, True, "CI test")
          ads.set_campaign_moderation(campaign4, 853680962, "approve", "CI test")
          assert ads.activate_paid_approved_campaigns() == 1
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              db.execute(
                  "UPDATE ad_campaigns SET status='paused', ends_at='2000-01-01T00:00:00+00:00' WHERE campaign_id=?",
                  (campaign4,),
              )
          try:
              ads.set_campaign_moderation(campaign4, 853680962, "resume", "expired")
          except ValueError:
              pass
          else:
              raise AssertionError("Expired campaign was resumed")
          assert ads.get_order(order4, advertiser)["campaign_status"] == "paused"

          # Admin lifecycle list includes active/paused campaigns, but excludes stopped ones.
          managed = ads.get_admin_campaigns()
          managed_ids = {item["campaign_id"] for item in managed}
          assert campaign4 in managed_ids, managed
          assert campaign2 not in managed_ids, managed
          assert all(item["status"] in ("active", "paused") for item in managed), managed

          campaign_stats = ads.get_campaign_ad_stats(campaign2)
          assert campaign_stats["impressions"] == 1, campaign_stats
          assert campaign_stats["clicks"] == 1, campaign_stats
          assert campaign_stats["ctr"] == 100.0, campaign_stats
          delivery = ads.get_ads_delivery_summary()
          assert delivery["impressions"] == 1 and delivery["clicks"] == 1, delivery
          assert delivery["ctr"] == 100.0, delivery

          # Only the configured Telegram account may approve payments or moderate ads.
          for protected_call in (
              lambda: ads.set_payment_review(order2, advertiser, True, "forbidden"),
              lambda: ads.set_campaign_moderation(campaign2, advertiser, "approve", "forbidden"),
          ):
              try:
                  protected_call()
              except PermissionError:
                  pass
              else:
                  raise AssertionError("Non-admin account changed ad state")

          # Rejecting a submitted payment returns the order to awaiting_payment;
          # a fresh proof can then be submitted and independently reviewed.
          campaign3 = ads.create_campaign_draft(
              advertiser, "Retry payment channel", "https://t.me/retry_test",
              "Payment retry test", 7, None
          )
          order3 = ads.create_ad_order(campaign3, advertiser)
          payment3 = ads.record_payment_submission(order3, advertiser, advertiser_note="first proof")
          ads.set_payment_review(order3, 853680962, False, "Proof did not match")
          with sqlite3.connect(os.environ["DATABASE_PATH"]) as db:
              payment_state = db.execute(
                  "SELECT status FROM ad_payments WHERE payment_id=?", (payment3,)
              ).fetchone()[0]
              order_state = db.execute(
                  "SELECT status FROM ad_orders WHERE order_id=?", (order3,)
              ).fetchone()[0]
          assert payment_state == "rejected", payment_state
          assert order_state == "awaiting_payment", order_state
          payment4 = ads.record_payment_submission(order3, advertiser, advertiser_note="replacement proof")
          assert payment4 > payment3
          ads.set_payment_review(order3, 853680962, True, "Replacement proof verified")
          assert ads.get_order(order3, advertiser)["status"] == "paid"
          assert ads.activate_paid_approved_campaigns() == 0

          print("PRIZORA Ads database and placement tests passed")
          PY
