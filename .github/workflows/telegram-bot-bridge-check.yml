name: PRIZORA shared SQLite web API checks

on:
  push:
    branches:
      - "feature/telegram-bot-account-bridge-*"
    paths:
      - "web_api.py"
      - "main.py"
      - "requirements.txt"
      - "tests/test_web_api.py"
      - "tests/test_telegram_smoke.py"
      - ".github/workflows/telegram-bot-bridge-check.yml"
  pull_request:
    paths:
      - "web_api.py"
      - "main.py"
      - "requirements.txt"
      - "tests/test_web_api.py"
      - "tests/test_telegram_smoke.py"
      - ".github/workflows/telegram-bot-bridge-check.yml"

permissions:
  contents: read

jobs:
  shared-sqlite-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile bot and bridge
        run: python -m py_compile main.py admin.py web_api.py
      - name: Test shared SQLite authentication and Telegram entry flows
        run: pytest -q tests/test_telegram_smoke.py tests/test_web_api.py
