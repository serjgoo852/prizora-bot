name: PRIZORA browser auth frontend checks

on:
  push:
    branches:
      - feature/browser-login-ui-2026-11-28
      - feature/cabinet-api-integration-2026-11-28
    paths:
      - "miniapp/auth-client.js"
      - "miniapp/index.html"
      - ".github/workflows/miniapp-auth-check.yml"
  pull_request:
    branches:
      - feature/telegram-unified-auth-2026-11-27
      - feature/browser-login-ui-2026-11-28
    paths:
      - "miniapp/auth-client.js"
      - "miniapp/index.html"
      - ".github/workflows/miniapp-auth-check.yml"

jobs:
  frontend-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check miniapp/auth-client.js
      - name: Check frontend integration contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("miniapp/index.html").read_text(encoding="utf-8")
          js = Path("miniapp/auth-client.js").read_text(encoding="utf-8")

          required_html = [
              'id="prizora-auth-area"',
              'src="/auth-client.js"',
              'name="prizora-auth-api-origin"',
              'content="https://prizora-bot-56941e.apps.dada-tuda.ru"',
          ]
          required_js = [
              '"/browser/request"',
              '"/browser/status"',
              '"/telegram/miniapp"',
              '"/me"',
              '"/api/cabinet"',
              '"/api/wallet/transactions?limit=10"',
              "poll_secret",
              "credentials: \"include\"",
          ]

          missing = [item for item in required_html if item not in html]
          missing += [item for item in required_js if item not in js]
          if missing:
              raise SystemExit("Missing frontend auth contract: " + ", ".join(missing))
          print("Frontend auth integration contract: OK")
          PY
      - name: Build static Mini App container
        run: docker build -t prizora-mini-auth-check ./miniapp
      - name: Smoke-test static Mini App container
        run: |
          docker run -d --name prizora-mini-auth-smoke -p 127.0.0.1:8080:8080 prizora-mini-auth-check
          trap 'docker rm -f prizora-mini-auth-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx 'ok'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'PRIZORA'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'https://prizora-bot-56941e.apps.dada-tuda.ru'
          curl -fsS http://127.0.0.1:8080/auth-client.js | grep -q 'startBrowserLogin'
