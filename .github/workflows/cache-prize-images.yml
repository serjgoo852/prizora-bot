name: Cache PRIZORA prize images

on:
  push:
    branches:
      - prizora-preview-pages
    paths:
      - ".github/workflows/cache-prize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: prizora-preview-pages
          persist-credentials: true

      - name: Download and optimize prize images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pip install --disable-pip-version-check Pillow requests
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests, time
          from PIL import Image

          sources = {
              "money": "https://freepngimg.com/thumb/money/48603-3-currency-free-png-hq.png",
              "iphone": "https://theapplewiki.com/images/applewiki/9/93/IPhone_18_Pro_Max_Silver.png",
              "playstation-5": "https://commons.wikimedia.org/wiki/Special:FilePath/PlayStation_5_and_DualSense_with_transparent_background.png",
              "switch-oled": "https://commons.wikimedia.org/wiki/Special:FilePath/Nintendo_Switch_OLED.png",
              "thinkpad": "https://commons.wikimedia.org/wiki/Special:FilePath/Lenovo_Thinkpad_X41.png",
              "garmin-watch": "https://commons.wikimedia.org/wiki/Special:FilePath/Garmin_MARQ_%28Gen2%29_Adventurer.png",
              "vacuum": "https://pngimg.com/uploads/vacuum_cleaner/vacuum_cleaner_PNG73.png",
              "headphones": "https://pngimg.com/uploads/headphones/headphones_PNG101982.png",
              "switch-2": "https://commons.wikimedia.org/wiki/Special:FilePath/Nintendo_Switch_2-Konsole_IL_20250606.png",
          }

          out = Path("assets/prizes")
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "PRIZORA-Preview-ImageCache/1.0 (GitHub Actions)"})
          for name, url in sources.items():
              response = None
              for attempt in range(7):
                  try:
                      response = session.get(url, timeout=90)
                      response.raise_for_status()
                      break
                  except requests.RequestException as exc:
                      if attempt == 6:
                          print(f"SKIP {name}: {exc}")
                          response = None
                          break
                      delay = min(15 * (attempt + 1), 90)
                      print(f"Retry {name} in {delay}s: {exc}")
                      time.sleep(delay)
              if response is None:
                  continue
              image = Image.open(BytesIO(response.content)).convert("RGBA")
              image.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
              target = out / f"{name}.webp"
              image.save(target, "WEBP", quality=86, method=6)
              print(f"{target}: {image.width}x{image.height}, {target.stat().st_size} bytes")
          PY

      - name: Commit optimized local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/prizes/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add optimized local prize images"
            git push origin HEAD:prizora-preview-pages
          fi
