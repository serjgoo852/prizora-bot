name: PRIZORA Telegram auth checks

on:
  push:
    branches:
      - "feature/telegram-unified-auth-*"
    paths:
      - "auth_service/**"
      - "miniapp/**"
      - ".github/workflows/telegram-auth-check.yml"
  pull_request:
    paths:
      - "auth_service/**"
      - ".github/workflows/telegram-auth-check.yml"

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auth_service/requirements.txt pytest
      - name: Run authentication unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q auth_service/tests
