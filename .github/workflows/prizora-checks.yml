name: PRIZORA checks

on:
  push:
    branches:
      - feature/prizora-premium-branding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preview possible banner repairs
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import base64
          import io
          import string
          import warnings
          from pathlib import Path
          from PIL import Image

          encoded = Path("assets/prizora_brand_banner.jpg.b64").read_text(encoding="ascii").strip()
          alphabet = string.ascii_letters + string.digits + "+/"
          matches = []
          for position in range(len(encoded) - 1):
              for character in alphabet:
                  candidate = encoded[:position] + character + encoded[position:]
                  try:
                      data = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if not data.startswith(b"\xff\xd8\xff"):
                      continue
                  try:
                      with warnings.catch_warnings():
                          warnings.simplefilter("error")
                          with Image.open(io.BytesIO(data)) as image:
                              image.load()
                              size = image.size
                              preview = image.convert("RGB")
                              preview.thumbnail((220, 124))
                              output = io.BytesIO()
                              preview.save(output, format="JPEG", quality=55, optimize=True)
                  except Exception:
                      continue
                  matches.append((position, character, data, output.getvalue(), size))
                  if len(matches) >= 12:
                      break
              if len(matches) >= 12:
                  break
          if not matches:
              raise SystemExit("No fully decodable JPEG repair candidate found")
          print(f"FULL_DECODE_MATCHES_SHOWN={len(matches)}")
          for index, (position, character, data, preview, size) in enumerate(matches):
              print(f"REPAIR_CANDIDATE index={index} position={position} character={character} size={size} bytes={len(data)}")
              print(f"PREVIEW_{index}={base64.b64encode(preview).decode('ascii')}")
          PY
      - name: Compile Python source
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
