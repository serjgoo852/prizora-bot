name: PRIZORA checks

on:
  push:
    branches:
      - feature/prizora-premium-branding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Repair-check bundled banner encoding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import base64
          import io
          import string
          import warnings
          from pathlib import Path
          from PIL import Image

          path = Path("assets/prizora_brand_banner.jpg.b64")
          encoded = path.read_text(encoding="ascii").strip()
          alphabet = string.ascii_letters + string.digits + "+/"
          matches = []
          for position in range(len(encoded) - 1):
              for character in alphabet:
                  candidate = encoded[:position] + character + encoded[position:]
                  try:
                      data = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if not data.startswith(b"\xff\xd8\xff"):
                      continue
                  try:
                      with warnings.catch_warnings():
                          warnings.simplefilter("error")
                          with Image.open(io.BytesIO(data)) as image:
                              size = image.size
                              image.load()
                              if image.size != size:
                                  continue
                  except Exception:
                      continue
                  matches.append((position, character, candidate))
                  if len(matches) >= 12:
                      break
              if len(matches) >= 12:
                  break
          if not matches:
              raise SystemExit("No fully decodable JPEG repair candidate found")
          print(f"FULL_DECODE_MATCHES={len(matches)}")
          for position, character, candidate in matches:
              print(f"REPAIR_CANDIDATE position={position} character={character} length={len(candidate)}")
          if len(matches) == 1:
              position, character, candidate = matches[0]
              path.write_text(candidate + "\n", encoding="ascii")
              print(f"REPAIR_FOUND position={position} character={character}")
          else:
              raise SystemExit("Multiple candidates fully decoded; manual selection required")
          PY
      - name: Compile Python source
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
