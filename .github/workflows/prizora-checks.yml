name: PRIZORA checks

on:
  push:
    branches:
      - feature/prizora-premium-branding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Repair-check bundled banner encoding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import base64
          import io
          import string
          from pathlib import Path
          from PIL import Image

          path = Path("assets/prizora_brand_banner.jpg.b64")
          encoded = path.read_text(encoding="ascii").strip()
          alphabet = string.ascii_letters + string.digits + "+/"
          matches = {}
          for position in range(len(encoded) - 1):
              for character in alphabet:
                  candidate = encoded[:position] + character + encoded[position:]
                  try:
                      data = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if not data.startswith(b"\xff\xd8\xff") or not data.endswith(b"\xff\xd9"):
                      continue
                  if base64.b64encode(data).decode("ascii") != candidate:
                      continue
                  try:
                      with Image.open(io.BytesIO(data)) as image:
                          image.verify()
                  except Exception:
                      continue
                  matches[candidate] = (position, character)
          if len(matches) != 1:
              raise SystemExit(f"Expected one canonical valid repair, found {len(matches)}")
          candidate, (position, character) = next(iter(matches.items()))
          path.write_text(candidate + "\n", encoding="ascii")
          print(f"REPAIR_FOUND position={position} character={character}")
          PY
      - name: Compile Python source
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
